<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로또 행운 추첨기</title>
<style>
  :root{
    --bg1:#07111f;
    --bg2:#0b1e35;
    --panel:#0f2947cc;
    --panel2:#102f50;
    --line:#ffffff24;
    --text:#eef7ff;
    --muted:#a9bdd0;
    --accent:#7ce3ff;
    --accent2:#ffd36a;
    --shadow:0 20px 60px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;background:
    radial-gradient(circle at 20% 10%, #123a65 0, transparent 32%),
    radial-gradient(circle at 80% 0%, #3a1f55 0, transparent 28%),
    linear-gradient(155deg,var(--bg1),var(--bg2));
    color:var(--text);
  }
  body{padding:18px}
  .app{width:min(1180px,100%);margin:0 auto}
  .top{
    display:flex;gap:18px;align-items:flex-end;justify-content:space-between;
    margin:8px 0 18px;
  }
  .eyebrow{font-size:.78rem;letter-spacing:.16em;color:var(--accent);font-weight:800}
  h1{font-size:clamp(1.8rem,4vw,3.5rem);margin:5px 0 8px;line-height:1}
  .sub{color:var(--muted);font-size:.98rem}
  .badge{
    border:1px solid #ffffff27;background:#ffffff0c;border-radius:999px;
    padding:10px 14px;color:#d9e8f5;font-size:.86rem;white-space:nowrap
  }

  .grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:18px}
  .card{
    background:linear-gradient(180deg,#0e2743d9,#091a2de8);
    border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
  }

  /* MACHINE */
  .machine-card{padding:18px;position:relative;overflow:hidden}
  .machine-stage{
    min-height:590px;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    border-radius:22px;
    background:
      radial-gradient(circle at 50% 40%, #173f67 0, #0a1e33 48%, #06111e 100%);
    overflow:hidden;
  }
  .machine-stage::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(110deg,transparent 25%,#ffffff09 42%,transparent 58%);
    pointer-events:none;
  }
  .machine-wrap{
    width:min(560px,92%);aspect-ratio:1/1.05;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .drum-shell{
    position:absolute;width:78%;aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle at 36% 26%, #ffffff22, transparent 24%),
      radial-gradient(circle at 50% 55%, #173b5d66, #09182720 66%),
      linear-gradient(145deg,#7df0ff18,#ffffff05);
    border:9px solid #bcecff36;
    box-shadow:
      inset 0 0 35px #b8f1ff14,
      0 0 0 4px #0a1526,
      0 18px 55px #0008;
    overflow:hidden;
  }
  .drum-shell::after{
    content:"";position:absolute;inset:7%;border-radius:50%;
    border:1px solid #dff9ff29;box-shadow:inset 0 0 55px #97eaff0d;
  }
  #drum{
    position:absolute;inset:0;border-radius:50%;
  }
  .axis{
    position:absolute;width:82%;height:12px;border-radius:999px;
    background:linear-gradient(#91a9ba,#d7e5ee,#71899a);
    box-shadow:0 5px 8px #0007;z-index:3;
  }
  .axis-cap{
    position:absolute;width:42px;height:42px;border-radius:50%;z-index:4;
    background:radial-gradient(circle at 35% 30%,#fff,#98aeba 35%,#415568 72%);
    border:3px solid #243748;box-shadow:0 5px 15px #0008;
  }
  .support{
    position:absolute;bottom:2%;width:72%;height:16%;
    background:linear-gradient(180deg,#274765,#0b1b2d);
    border:1px solid #ffffff22;border-radius:28px 28px 15px 15px;
    box-shadow:0 15px 30px #0007;
  }
  .support::before,.support::after{
    content:"";position:absolute;bottom:80%;width:13px;height:160px;border-radius:12px;
    background:linear-gradient(90deg,#304d65,#adc4d4,#304d65);
  }
  .support::before{left:15%;transform:rotate(8deg)}
  .support::after{right:15%;transform:rotate(-8deg)}
  .chute{
    position:absolute;right:4%;bottom:18%;width:32%;height:64px;
    transform:rotate(-9deg);transform-origin:right center;
    border:2px solid #b7f2ff36;border-radius:8px 30px 30px 8px;
    background:linear-gradient(180deg,#d9fbff18,#0b263c55);
    box-shadow:inset 0 0 24px #b4f4ff12,0 10px 20px #0005;
    overflow:hidden;z-index:8;
  }
  .chute-lip{
    position:absolute;right:0;top:-3px;width:34px;height:68px;border-radius:50%;
    border:3px solid #dffaff55;background:#0e2946;z-index:9;
  }
  .ball{
    position:absolute;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;
    color:#18202a;font-weight:900;font-size:.88rem;
    border:2px solid rgba(255,255,255,.7);
    box-shadow:inset -5px -7px 10px rgba(0,0,0,.16),inset 5px 6px 9px rgba(255,255,255,.55),0 4px 9px #0005;
    user-select:none;
    will-change:transform;
    z-index:2;
  }
  .ball.small{width:34px;height:34px;font-size:.8rem}
  .ball.result{
    position:relative;width:58px;height:58px;font-size:1.1rem;
    animation:pop .45s cubic-bezier(.2,.85,.28,1.4);
  }
  @keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}
  .spin-glow{
    position:absolute;width:86%;aspect-ratio:1;border-radius:50%;
    border:2px solid transparent;
    box-shadow:0 0 55px #5ae8ff00;
    transition:.25s;
    pointer-events:none;
  }
  .spinning .spin-glow{box-shadow:0 0 70px #5ae8ff33;border-color:#73efff15}

  /* CONTROL */
  .side{padding:18px;display:flex;flex-direction:column;gap:14px}
  .panel{
    background:#ffffff08;border:1px solid #ffffff12;border-radius:20px;padding:16px;
  }
  .panel-title{font-weight:900;font-size:1rem;margin-bottom:9px}
  .status{
    font-size:1.2rem;font-weight:900;min-height:31px;color:#fff;
  }
  .status small{display:block;font-weight:500;color:var(--muted);font-size:.8rem;margin-top:4px}
  .controls{display:grid;grid-template-columns:1fr;gap:10px}
  button{
    appearance:none;border:0;border-radius:16px;padding:15px 16px;
    font-size:1rem;font-weight:900;cursor:pointer;transition:.18s transform,.18s filter,.18s opacity;
  }
  button:hover{transform:translateY(-1px);filter:brightness(1.06)}
  button:active{transform:translateY(1px) scale(.99)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .primary{
    color:#07111f;background:linear-gradient(135deg,#85f3ff,#6cbcff);
    box-shadow:0 10px 25px #4fd7ff35;
  }
  .secondary{color:#fff;background:#ffffff12;border:1px solid #ffffff1b}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toggle{
    background:#ffffff08;border:1px solid #ffffff12;border-radius:15px;padding:11px 12px;
  }
  .toggle label{display:flex;align-items:center;gap:8px;font-size:.88rem;color:#dfeaf3;cursor:pointer}
  input[type="checkbox"]{accent-color:#75e3ff;width:17px;height:17px}

  .result-box{min-height:147px}
  .result-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
  .bonus-sep{display:flex;align-items:center;color:#8fa7ba;font-weight:800;padding:0 2px}
  .history{display:flex;flex-direction:column;gap:7px;max-height:175px;overflow:auto;padding-right:3px}
  .hist-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-bottom:1px solid #ffffff0c;padding:8px 0;font-size:.84rem
  }
  .hist-nums{display:flex;gap:5px;flex-wrap:wrap}
  .mini{
    width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
    color:#17202a;font-size:.68rem;font-weight:900;border:1px solid #ffffff88;
  }
  .hint{font-size:.79rem;color:#94a9ba;line-height:1.5}
  .footer-note{font-size:.76rem;color:#8095a7;text-align:center;margin:14px 0 4px}

  .drawn-ball{
    position:absolute;z-index:20;width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;color:#18202a;font-weight:900;
    border:2px solid #fff9;
    box-shadow:inset -5px -7px 10px #0002,inset 5px 6px 9px #fff8,0 6px 12px #0007;
    pointer-events:none;
  }

  @media(max-width:900px){
    body{padding:12px}
    .top{align-items:flex-start;flex-direction:column}
    .grid{grid-template-columns:1fr}
    .machine-stage{min-height:520px}
    .side{display:grid;grid-template-columns:1fr 1fr}
    .side .panel:nth-child(1),.side .panel:nth-child(2){grid-column:span 1}
    .side .panel:nth-child(n+3){grid-column:1/-1}
  }
  @media(max-width:620px){
    .badge{white-space:normal}
    .machine-card,.side{padding:12px}
    .machine-stage{min-height:420px}
    .machine-wrap{width:100%}
    .drum-shell{width:82%}
    .ball{width:29px;height:29px;font-size:.66rem}
    .chute{width:36%;height:50px;bottom:17%}
    .chute-lip{height:55px}
    .side{grid-template-columns:1fr}
    .side .panel{grid-column:1!important}
    .ball.result{width:49px;height:49px;font-size:.98rem}
    h1{font-size:2.2rem}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow">LUCKY DRAW MACHINE</div>
      <h1>이번 주 행운 로또 추첨기</h1>
      <div class="sub">큰 추첨통이 회전하고, 1~45번 구슬 중 6개가 무작위로 나옵니다.</div>
    </div>
    <div class="badge">오락용 무작위 추천 · 실제 당첨을 예측하지 않습니다</div>
  </header>

  <main class="grid">
    <section class="card machine-card">
      <div class="machine-stage" id="stage">
        <div class="machine-wrap" id="machineWrap">
          <div class="spin-glow"></div>
          <div class="axis"></div>
          <div class="drum-shell"><div id="drum"></div></div>
          <div class="axis-cap"></div>
          <div class="chute" id="chute"></div>
          <div class="chute-lip"></div>
          <div class="support"></div>
        </div>
      </div>
    </section>

    <aside class="card side">
      <div class="panel">
        <div class="panel-title">추첨 상태</div>
        <div class="status" id="status">추첨 준비 완료
          <small>버튼을 누르면 추첨통이 회전합니다.</small>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">게임 설정</div>
        <div class="options">
          <div class="toggle">
            <label><input id="soundToggle" type="checkbox" checked> 효과음</label>
          </div>
          <div class="toggle">
            <label><input id="bonusToggle" type="checkbox"> 보너스 1개</label>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="controls">
          <button class="primary" id="drawBtn">🎱 추첨 시작</button>
          <button class="secondary" id="resetBtn">다시 섞기</button>
        </div>
      </div>

      <div class="panel result-box">
        <div class="panel-title">행운 추천 번호</div>
        <div class="result-row" id="results">
          <span class="hint">아직 추첨된 번호가 없습니다.</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">최근 추첨 기록</div>
        <div class="history" id="history">
          <div class="hint">추첨 기록은 이 화면에서만 임시 보관됩니다.</div>
        </div>
      </div>
    </aside>
  </main>
  <div class="footer-note">각 조합의 실제 당첨 확률은 동일하며, 과거 번호·패턴은 미래 당첨을 보장하지 않습니다.</div>
</div>

<script>
(() => {
  const drum = document.getElementById('drum');
  const stage = document.getElementById('stage');
  const machineWrap = document.getElementById('machineWrap');
  const drawBtn = document.getElementById('drawBtn');
  const resetBtn = document.getElementById('resetBtn');
  const results = document.getElementById('results');
  const status = document.getElementById('status');
  const historyEl = document.getElementById('history');
  const bonusToggle = document.getElementById('bonusToggle');
  const soundToggle = document.getElementById('soundToggle');

  const balls = [];
  let running = false;
  let raf = null;
  let last = performance.now();
  let history = [];
  let audioCtx = null;

  function ballColor(n){
    if(n <= 10) return 'linear-gradient(145deg,#ffe98b,#f2b52f)';
    if(n <= 20) return 'linear-gradient(145deg,#9be6ff,#4da8df)';
    if(n <= 30) return 'linear-gradient(145deg,#ff9d9d,#ef5b67)';
    if(n <= 40) return 'linear-gradient(145deg,#c9cad1,#7d8490)';
    return 'linear-gradient(145deg,#b8f6ad,#5fc879)';
  }

  function beep(freq=420, duration=.06, volume=.035){
    if(!soundToggle.checked) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.value = volume;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
      osc.stop(audioCtx.currentTime+duration);
    }catch(e){}
  }

  function createBalls(){
    drum.innerHTML = '';
    balls.length = 0;
    const rect = drum.getBoundingClientRect();
    const size = innerWidth < 620 ? 29 : 38;
    const R = Math.max(70, rect.width/2 - size/1.3);
    for(let n=1;n<=45;n++){
      const el = document.createElement('div');
      el.className = 'ball';
      el.textContent = n;
      el.style.background = ballColor(n);
      drum.appendChild(el);
      const angle = Math.random()*Math.PI*2;
      const radius = Math.sqrt(Math.random()) * (R-size/2);
      balls.push({
        n,el,
        x:rect.width/2 + Math.cos(angle)*radius - size/2,
        y:rect.height/2 + Math.sin(angle)*radius - size/2,
        vx:(Math.random()-.5)*1.2,
        vy:(Math.random()-.5)*1.2,
        size
      });
    }
    render();
  }

  function render(){
    balls.forEach(b => b.el.style.transform = `translate(${b.x}px,${b.y}px)`);
  }

  function physics(now){
    const dt = Math.min(2, (now-last)/16.67); last=now;
    const rect = drum.getBoundingClientRect();
    const cx=rect.width/2, cy=rect.height/2, maxR=rect.width/2-8;
    const spin = running ? .20 : .025;

    for(const b of balls){
      const bx=b.x+b.size/2, by=b.y+b.size/2;
      const dx=bx-cx, dy=by-cy;
      const dist=Math.max(1,Math.hypot(dx,dy));
      // tangential rotation
      b.vx += (-dy/dist)*spin*dt;
      b.vy += ( dx/dist)*spin*dt;
      // random turbulence
      if(running){
        b.vx += (Math.random()-.5)*.32;
        b.vy += (Math.random()-.5)*.32;
      }
      b.vx *= running ? .992 : .96;
      b.vy *= running ? .992 : .96;
      b.x += b.vx*dt*2.2;
      b.y += b.vy*dt*2.2;

      const nbx=b.x+b.size/2, nby=b.y+b.size/2;
      const ndx=nbx-cx, ndy=nby-cy, nd=Math.hypot(ndx,ndy);
      if(nd + b.size/2 > maxR){
        const nx=ndx/nd, ny=ndy/nd;
        const target=maxR-b.size/2;
        b.x=cx+nx*target-b.size/2;
        b.y=cy+ny*target-b.size/2;
        const dot=b.vx*nx+b.vy*ny;
        b.vx -= 1.85*dot*nx;
        b.vy -= 1.85*dot*ny;
      }
    }
    render();
    raf=requestAnimationFrame(physics);
  }

  function secureShuffle(arr){
    const a=[...arr];
    if(window.crypto?.getRandomValues){
      const buf=new Uint32Array(a.length);
      crypto.getRandomValues(buf);
      for(let i=a.length-1;i>0;i--){
        const j=buf[i]%(i+1);
        [a[i],a[j]]=[a[j],a[i]];
      }
    }else{
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
    }
    return a;
  }

  function wait(ms){return new Promise(r=>setTimeout(r,ms))}

  async function animateEject(number, index, total){
    const b = balls.find(x=>x.n===number);
    if(!b) return;
    b.el.style.opacity='0';
    const stageRect=stage.getBoundingClientRect();
    const wrapRect=machineWrap.getBoundingClientRect();
    const startX=wrapRect.left-stageRect.left + wrapRect.width*.57;
    const startY=wrapRect.top-stageRect.top + wrapRect.height*.49;
    const endX=wrapRect.left-stageRect.left + wrapRect.width*.84;
    const endY=wrapRect.top-stageRect.top + wrapRect.height*.72;

    const e=document.createElement('div');
    e.className='drawn-ball';
    e.textContent=number;
    e.style.background=ballColor(number);
    e.style.left=startX+'px';e.style.top=startY+'px';
    stage.appendChild(e);

    const anim=e.animate([
      {transform:'translate(0,0) rotate(0deg) scale(.85)',offset:0},
      {transform:`translate(${(endX-startX)*.45}px,${(endY-startY)*.05-50}px) rotate(250deg) scale(1.02)`,offset:.42},
      {transform:`translate(${endX-startX}px,${endY-startY}px) rotate(620deg) scale(1)`,offset:1}
    ],{duration:720,easing:'cubic-bezier(.18,.8,.25,1)',fill:'forwards'});
    beep(520+index*55,.09,.045);
    await anim.finished;
    e.remove();

    const rb=document.createElement('div');
    rb.className='ball result';
    rb.textContent=number;
    rb.style.background=ballColor(number);
    if(index===6 && total===7){
      const sep=document.createElement('span');
      sep.className='bonus-sep';
      sep.textContent='+';
      results.appendChild(sep);
    }
    results.appendChild(rb);
  }

  function setStatus(main, sub=''){
    status.innerHTML = `${main}${sub?`<small>${sub}</small>`:''}`;
  }

  async function draw(){
    if(running) return;
    running=true;
    drawBtn.disabled=true; resetBtn.disabled=true;
    machineWrap.classList.add('spinning');
    results.innerHTML='';
    balls.forEach(b=>b.el.style.opacity='1');
    setStatus('추첨통 회전 중…','45개의 구슬을 무작위로 섞고 있습니다.');
    beep(220,.18,.025);

    await wait(1700);
    const count=bonusToggle.checked?7:6;
    const picks=secureShuffle(Array.from({length:45},(_,i)=>i+1)).slice(0,count);

    for(let i=0;i<picks.length;i++){
      setStatus(`${i+1}${i===6?'번째 (보너스)':'번째'} 구슬 추첨 중…`, '구슬이 배출구로 이동합니다.');
      await animateEject(picks[i],i,count);
      await wait(330);
    }

    running=false;
    machineWrap.classList.remove('spinning');
    drawBtn.disabled=false; resetBtn.disabled=false;
    setStatus('추첨 완료!', '마음에 들면 기록을 남겨두고 다시 추첨해보세요.');
    beep(880,.16,.05);
    history.unshift({nums:picks.slice(0,6).sort((a,b)=>a-b),bonus:count===7?picks[6]:null});
    history=history.slice(0,6);
    renderHistory();
  }

  function renderHistory(){
    historyEl.innerHTML='';
    if(!history.length){
      historyEl.innerHTML='<div class="hint">추첨 기록은 이 화면에서만 임시 보관됩니다.</div>';
      return;
    }
    history.forEach((h,idx)=>{
      const row=document.createElement('div');
      row.className='hist-row';
      const label=document.createElement('span');
      label.textContent=`#${history.length-idx}`;
      label.style.color='#8ea4b7';
      const nums=document.createElement('div');
      nums.className='hist-nums';
      h.nums.forEach(n=>{
        const m=document.createElement('span');m.className='mini';m.textContent=n;m.style.background=ballColor(n);nums.appendChild(m);
      });
      if(h.bonus){
        const plus=document.createElement('span');plus.textContent='+';plus.style.alignSelf='center';plus.style.color='#8ea4b7';nums.appendChild(plus);
        const m=document.createElement('span');m.className='mini';m.textContent=h.bonus;m.style.background=ballColor(h.bonus);nums.appendChild(m);
      }
      row.append(label,nums);historyEl.appendChild(row);
    });
  }

  resetBtn.addEventListener('click',()=>{
    if(running)return;
    results.innerHTML='<span class="hint">아직 추첨된 번호가 없습니다.</span>';
    setStatus('다시 준비 완료','구슬 위치를 새로 섞었습니다.');
    createBalls();beep(300,.07,.025);
  });
  drawBtn.addEventListener('click',draw);

  let resizeTimer;
  addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(createBalls,180)});
  createBalls();
  raf=requestAnimationFrame(physics);
})();
</script>
</body>
</html>
